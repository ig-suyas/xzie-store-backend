spring.application.name=user-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/XzieLogin}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate=WARN

eureka.client.enabled=false

google.client-id=${GOOGLE_CLIENT_ID}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.7-flash
gemini.fallback-model=gemini-3.5-flash-lite
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

chat.max-history=6
chat.max-message-length=500
chat.rate-limit-per-minute=10
chat.max-products-in-prompt=100

server.port=${PORT:8080}
server.forward-headers-strategy=framework

jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}